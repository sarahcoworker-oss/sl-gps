<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Second Life GPS</title>

    <script
        src="https://maps.secondlife.com/_scripts/sl.mapapi2.js"
        type="text/javascript">
    </script>

    <link
        rel="stylesheet"
        type="text/css"
        href="https://maps.secondlife.com/_styles/sl.mapapi2.css">

    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #111;
        }

        #map-container {
            width: 100%;
            height: 100%;
        }

        .gps-dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #ff3333;
            border: 3px solid white;
            box-sizing: border-box;
            box-shadow: 0 0 6px rgba(0, 0, 0, 0.8);
        }
    </style>

    <script>

        function getParameter(name) {

            var params = new URLSearchParams(
                window.location.search
            );

            return parseFloat(
                params.get(name)
            );
        }

        function loadmap() {

            /*
             * Pour le test, on utilise une position
             * fixe si aucune position n'est fournie.
             */
            var x = getParameter("x");
            var y = getParameter("y");

            if (isNaN(x)) {
                x = 1002;
            }

            if (isNaN(y)) {
                y = 997;
            }

            /*
             * Création de la carte.
             */
            var lmap = SLMap(
                document.getElementById("map-container")
            );

            /*
             * Centre de la carte.
             *
             * L'API SL utilise [Y, X].
             */
            lmap.setView(
                [y, x],
                5
            );

            /*
             * Création de notre point GPS.
             */
            var icon = L.icon({
                iconUrl: "https://maps.secondlife.com/examples/b_map_yellow.gif",
                iconSize: [9, 9],
            });

            /*
             * Position du joueur.
             */
            L.marker(
                [x, y],
                {
                    icon: icon
                }
            ).addTo(lmap);
        }

    </script>

</head>

<body onload="loadmap()">

    <div id="map-container"></div>

</body>
</html>
