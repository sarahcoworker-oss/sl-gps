<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">

    <title>Second Life GPS</title>

    <script
        src="https://maps.secondlife.com/_scripts/sl.mapapi2.js"
        type="text/javascript">
    </script>

    <link
        rel="stylesheet"
        type="text/css"
        href="https://maps.secondlife.com/_styles/sl.mapapi2.css">

    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #111;
        }

        #map-container {
            width: 100%;
            height: 100%;
        }
    </style>

    <script>
        function loadMap() {

            var map = new SLMap(
                document.getElementById("map-container")
            );

            /*
             * Position de test :
             * X = 1002
             * Y = 997
             *
             * L'API attend [Y, X].
             */
            map.setView(
                [997, 1002],
                7
            );
        }
    </script>

</head>

<body onload="loadMap()">

    <div id="map-container"></div>

</body>
</html>
