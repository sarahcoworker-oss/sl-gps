<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Second Life GPS</title>

    <script
        src="https://maps.secondlife.com/_scripts/sl.mapapi2.js"
        type="text/javascript">
    </script>

    <link
        rel="stylesheet"
        type="text/css"
        href="https://maps.secondlife.com/_styles/sl.mapapi2.css">

    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #111;
        }

        #map-container {
            width: 100%;
            height: 100%;
        }

        .gps-dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #ff3333;
            border: 3px solid white;
            box-sizing: border-box;
            box-shadow: 0 0 6px rgba(0, 0, 0, 0.8);
        }
    </style>

    <script>

        function getParameter(name) {

            var params = new URLSearchParams(
                window.location.search
            );

            return parseFloat(
                params.get(name)
            );
        }

function loadmap() {

    var x = getParameter("x");
    var y = getParameter("y");

    if (isNaN(x)) {
        x = 1002;
    }

    if (isNaN(y)) {
        y = 997;
    }

    var lmap = SLMap(
        document.getElementById("map-container")
    );

    lmap.setView(
        [y, x],
        7
    );

    var icon = L.icon({
        iconUrl: "https://maps.secondlife.com/examples/b_map_yellow.gif",
        iconSize: [9, 9]
    });

    L.marker(
        [y, x],
        {
            icon: icon
        }
    ).addTo(lmap);
}
        }

    </script>

</head>

<body onload="loadmap()">

    <div id="map-container"></div>

</body>
</html>
